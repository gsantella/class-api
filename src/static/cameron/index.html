<h1>Cameron Lives Here</h1>

<button id="loadBtn">Click me</button>
<div id="content">click the button to load it from the API</div>

<button id="colorBtn">Colors!</button>
<br>
<input id="word">
<br>
<button id="getWordBtn">Get</button>
<button id="patchWordBtn">Patch</button>
<button id="deleteWordBtn">Delete</button>

<script>
    document.getElementById('loadBtn').addEventListener('click', () => {
        fetch('/api/cameron/')
            .then(res => res.text())
            .then(text => {
                document.getElementById('content').textContent = text;
            })
            .catch(err => console.error(err));
    });

    document.getElementById('colorBtn').addEventListener('click', () => {
        fetch('/api/cameron/color')
            .then(res => res.text())
            .then(text => {
                document.getElementById('colorBtn').style.backgroundColor = text;
            })
            .catch(err => console.error(err));
    });

    document.getElementById('getWordBtn').addEventListener('click', () => {
        fetch('/api/cameron/word')
            .then(res => res.text())
            .then(text => {
                document.getElementById('word').value = text;
            })
            .catch(err => console.error(err));
    });

    document.getElementById('patchWordBtn').addEventListener('click', () => {
        const textPayload = {
                value: document.getElementById('word').value
            };
        fetch("/api/cameron/word", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(textPayload)
        });
    });

    document.getElementById('deleteWordBtn').addEventListener('click', () => {
        fetch('/api/cameron/word', {
            method: "DELETE"
        })
            .then(document.getElementById('word').value = "")
            .catch(err => console.error(err));
    });
</script>
