<h1>Cameron Lives Here</h1>

<button id="loadBtn">Click me</button>
<div id="content">click the button to load it from the API</div>

<button id="colorBtn">Colors!</button>
<br>
<input id="word">
<br>
<button id="getWordBtn">Get</button>
<button id="patchWordBtn">Patch</button>
<button id="deleteWordBtn">Delete</button>
<br>
<h1>Card Info</h1>
<input id="name" placeholder="name"><input id="cost" placeholder="cost">
<br>
<input id="type" placeholder="type"><input id="subtype" placeholder="subtype">
<br>
<input id="rules" placeholder="rules"><input id="flavor" placeholder="flavor">
<br>
<input id="power" placeholder="P"><input id="toughness" placeholder="T">
<br>
<input id="id" placeholder="id"><input id="illustrator" placeholder="illustrator">
<br>
<button id="getCard">Get card by ID</button>
<button id="setCard">Submit card by ID</button>
<!--    "id": "3",
        "name": "Ms. Bumbleflower",
        "cost": "{1}{G}{W}{B}",
        "type": "Legendary Creature",
        "subtype": "Rabbit Citizen",
        "Rules": "Vigilance\nWhenever you cast a spell, target opponent draws a card. Put a +1/+1 counter on target creature. It gains flying until end of turn. If this is the second time this ability has resolved this turn, you draw two cards.",
        "Flavor": "",
        "Power": 1,
        "Toughness": 5,
        "Illustrator": "Marta Nael"
    -->
<script>

    document.getElementById('getCard').addEventListener('click', () => {
        fetch(`/api/cameron/card/blc/${encodeURIComponent(document.getElementById("id").value)}`)
            .then(res => res.json())
            .then(json => {
                document.getElementById('name').value = json.name;
                document.getElementById('cost').value = json.cost;
                document.getElementById('type').value = json.type;
                document.getElementById('subtype').value = json.subtype;
                document.getElementById('rules').value = json.rules;
                document.getElementById('flavor').value = json.flavor;
                document.getElementById('power').value = json.power;
                document.getElementById('toughness').value = json.toughness;
                document.getElementById('illustrator').value = json.illustrator;
            })
            .catch(err => console.error(err));
    });

    document.getElementById('setCard').addEventListener('click', () => {
        jsonPayload => {
                jsonPayload.name = document.getElementById('name').value;
                jsonPayload.cost = document.getElementById('cost').value;
                jsonPayload.type = document.getElementById('type').value;
                jsonPayload.subtype = document.getElementById('subtype').value;
                jsonPayload.rules = document.getElementById('rules').value;
                jsonPayload.flavor = document.getElementById('flavor').value;
                jsonPayload.power = document.getElementById('power').value;
                jsonPayload.toughness = document.getElementById('toughness').value;
                jsonPayload.illustrator = document.getElementById('illustrator').value;
            };
        fetch(`/api/cameron/card/blc/${encodeURIComponent(document.getElementById("id").value)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: jsonPayload
        });
    });

    document.getElementById('loadBtn').addEventListener('click', () => {
        fetch('/api/cameron/')
            .then(res => res.text())
            .then(text => {
                document.getElementById('content').textContent = text;
            })
            .catch(err => console.error(err));
    });

    document.getElementById('colorBtn').addEventListener('click', () => {
        fetch('/api/cameron/color')
            .then(res => res.text())
            .then(text => {
                document.getElementById('colorBtn').style.backgroundColor = text;
            })
            .catch(err => console.error(err));
    });

    document.getElementById('getWordBtn').addEventListener('click', () => {
        fetch('/api/cameron/word')
            .then(res => res.text())
            .then(text => {
                document.getElementById('word').value = text;
            })
            .catch(err => console.error(err));
    });

    document.getElementById('patchWordBtn').addEventListener('click', () => {
        const textPayload = {
                value: document.getElementById('word').value
            };
        fetch("/api/cameron/word", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(textPayload)
        });
    });

    document.getElementById('deleteWordBtn').addEventListener('click', () => {
        fetch('/api/cameron/word', {
            method: "DELETE"
        })
            .then(document.getElementById('word').value = "")
            .catch(err => console.error(err));
    });
</script>
