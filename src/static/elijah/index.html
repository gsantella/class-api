<h1>i'm elijah</h1>

<button id="loadBtn">Click me</button>
<div id="content">click the button to load it from the API</div>

<script>
    document.getElementById('loadBtn').addEventListener('click', () => {
        fetch('/api/elijah/randomColor')
            .then(res => res.text())
            .then(color => {                
                document.getElementById('content').textContent = `Random Color: ${color}`;        
                document.getElementById('content').style.color = color;      
            })
            .catch(err => console.error(err));
    });
</script>
