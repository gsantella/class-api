<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brand New API</title>
</head>
<body>

    <h1>Brand New Music API</h1>

    <button id="loadBtn">View All Albums</button>
    <pre id="content" style="background: #f4f4f4; padding: 10px; max-width: 800px; max-height: 400px; overflow-y: auto; overflow-x: auto;">Click the button to load all albums from the API</pre>

    <div style="display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap;">
        <form id="viewAlbum" style="display: flex; flex-direction: column; max-width: fit-content;">
            <h3>View Single Album</h3>
            <input type="text" id="viewAlbumName" placeholder="Enter Album Name" required>
            <button type="submit">View Album</button>
        </form>

        <form id="addAlbum" style="display: flex; flex-direction: column; max-width: fit-content;">
            <h3>Add Album</h3>
            <input type="text" id="addAlbumName" placeholder="Album Name" required>
            <input type="text" id="addReleaseDate" placeholder="Release Date" required>
            <button type="submit">Post Album</button>
        </form>

        <form id="updateAlbum" style="display: flex; flex-direction: column; max-width: fit-content;">
            <h3>Update Release Date</h3>
            <input type="text" id="updateAlbumName" placeholder="Target Album Name" required>
            <input type="text" id="updateReleaseDate" placeholder="New Release Date" required>
            <button type="submit">Update Album</button>
        </form>

        <form id="renameAlbum" style="display: flex; flex-direction: column; max-width: fit-content;">
            <h3>Rename Album</h3>
            <input type="text" id="renameOldAlbum" placeholder="Current Album Name" required>
            <input type="text" id="renameNewAlbum" placeholder="New Album Name" required>
            <button type="submit">Rename</button>
        </form>

        <form id="deleteAlbum" style="display: flex; flex-direction: column; max-width: fit-content;">
            <h3>Delete Album</h3>
            <input type="text" id="deleteAlbumName" placeholder="Target Album Name" required>
            <button type="submit">Delete Album</button>
        </form>

        <form id="addSong" style="display: flex; flex-direction: column; max-width: fit-content;">
            <h3>Add Song</h3>
            <input type="text" id="targetAlbumForSong" placeholder="Target Album Name" required>
            <input type="text" id="songName" placeholder="Song Name" required>
            <input type="text" id="songLength" placeholder="Length (e.g. 3:45)" required>
            <button type="submit">Add Song</button>
        </form>

        <form id="updateSong" style="display: flex; flex-direction: column; max-width: fit-content;">
            <h3>Update Song</h3>
            <input type="text" id="updateSongAlbum" placeholder="Target Album Name" required>
            <input type="text" id="currentSongName" placeholder="Current Song Name" required>
            <input type="text" id="newSongName" placeholder="New Song Name (Optional)">
            <input type="text" id="newSongLength" placeholder="New Length (Optional)">
            <button type="submit">Update Song</button>
        </form>
    </div>

    <p id="message" style="font-weight: bold; color: blue;"></p>

    <script>
        const message = document.getElementById("message");
        const content = document.getElementById("content");

        document.getElementById("loadBtn").addEventListener("click", async (event) => {
            try {
                const response = await fetch("/api/elijah/albums");
                const data = await response.json();

                content.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });

        document.getElementById("viewAlbum").addEventListener("submit", async (event) => {
            event.preventDefault();

            const albumName = document.getElementById("viewAlbumName").value;

            try {
                const response = await fetch(`/api/elijah/albums/${encodeURIComponent(albumName)}`);
                const data = await response.json();

                if (response.ok) {
                    content.textContent = JSON.stringify(data, null, 2);
                    message.textContent = "Album loaded successfully!";
                } else {
                    message.textContent = data.error;
                }

                document.getElementById("viewAlbum").reset();
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });

        document.getElementById("addAlbum").addEventListener("submit", async (event) => {
            event.preventDefault();

            const albumData = {
                albumName: document.getElementById("addAlbumName").value,
                releaseDate: document.getElementById("addReleaseDate").value
            };

            try {
                const response = await fetch("/api/elijah/albums", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(albumData)
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = result.message;
                } else {
                    message.textContent = result.error;
                }

                document.getElementById("addAlbum").reset();
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });

        document.getElementById("updateAlbum").addEventListener("submit", async (event) => {
            event.preventDefault();

            const albumName = document.getElementById("updateAlbumName").value;
            const albumData = {
                releaseDate: document.getElementById("updateReleaseDate").value
            };

            try {
                const response = await fetch(`/api/elijah/albums/${encodeURIComponent(albumName)}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(albumData)
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = result.message;
                } else {
                    message.textContent = result.error;
                }

                document.getElementById("updateAlbum").reset();
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });

        document.getElementById("deleteAlbum").addEventListener("submit", async (event) => {
            event.preventDefault();

            const albumName = document.getElementById("deleteAlbumName").value;

            try {
                const response = await fetch(`/api/elijah/albums/${encodeURIComponent(albumName)}`, {
                    method: "DELETE"
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = result.message;
                } else {
                    message.textContent = result.error;
                }

                document.getElementById("deleteAlbum").reset();
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });

        document.getElementById("addSong").addEventListener("submit", async (event) => {
            event.preventDefault();

            const albumName = document.getElementById("targetAlbumForSong").value;
            const songData = {
                songName: document.getElementById("songName").value,
                length: document.getElementById("songLength").value
            };

            try {
                const response = await fetch(`/api/elijah/albums/${encodeURIComponent(albumName)}/songs`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(songData)
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = result.message;
                } else {
                    message.textContent = result.error;
                }

                document.getElementById("addSong").reset();
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });

        document.getElementById("renameAlbum").addEventListener("submit", async (event) => {
            event.preventDefault();

            const oldAlbumName = document.getElementById("renameOldAlbum").value;
            const data = {
                newAlbumName: document.getElementById("renameNewAlbum").value
            };

            try {
                const response = await fetch(`/api/elijah/albums/${encodeURIComponent(oldAlbumName)}/rename`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = result.message;
                } else {
                    message.textContent = result.error;
                }

                document.getElementById("renameAlbum").reset();
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });

        document.getElementById("updateSong").addEventListener("submit", async (event) => {
            event.preventDefault();

            const albumName = document.getElementById("updateSongAlbum").value;
            const currentSongName = document.getElementById("currentSongName").value;
            const songData = {
                newTrackTitle: document.getElementById("newSongName").value,
                newTrackDuration: document.getElementById("newSongLength").value
            };

            try {
                const response = await fetch(`/api/elijah/albums/${encodeURIComponent(albumName)}/songs/${encodeURIComponent(currentSongName)}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(songData)
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = result.message;
                } else {
                    message.textContent = result.error;
                }

                document.getElementById("updateSong").reset();
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
    <title>Elijah's API</title>
</head>
<body>
    <h1>Elijah's API</h1>

    <h2>Favorite Song (Global)</h2>
    <div>
        <h3>Current Favorite Song:</h3>
        <p id="songDisplay">N/A</p>
    </div>

    <br>

    <div>
        <button id="getSongBtn">Get Current Favorite Song (GET)</button>
    </div>

    <br>

    <div>
        <input type="text" id="newSongInput" placeholder="Enter song title">
        <button id="updateSongBtn">Update Favorite Song (PATCH)</button>
    </div>

    <br>

    <div>
        <button id="deleteSongBtn">Clear Favorite Song (DELETE)</button>
    </div>

    <script>
        const songDisplay = document.getElementById('songDisplay');

        function fetchFavoriteSong() {
            fetch('/api/elijah/favoriteSong')
                .then(res => res.text())
                .then(text => {
                    songDisplay.textContent = text === "" ? "N/A" : text;
                })
                .catch(err => console.error(err));
        }

        document.getElementById('getSongBtn').addEventListener('click', fetchFavoriteSong);

        document.getElementById('updateSongBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('newSongInput').value;
            fetch('/api/elijah/favoriteSong', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ song: inputVal })
            })
            .then(res => res.text())
            .then(message => {
                alert(message);
                document.getElementById('newSongInput').value = '';            
            })
            .catch(err => console.error(err));
        });

        document.getElementById('deleteSongBtn').addEventListener('click', () => {
            fetch('/api/elijah/favoriteSong', {
                method: 'DELETE'
            })
            .then(res => res.text())
            .then(message => {
                alert(message);            })
            .catch(err => console.error(err));
        });
    </script>
</body>
</html>
<script>
    document.getElementById('loadBtn').addEventListener('click', () => {
        fetch('/api/elijah/randomColor')
            .then(res => res.text())
            .then(color => {                
                document.getElementById('content').textContent = `Random Color: ${color}`;        
                document.getElementById('content').style.color = color;      
            })
            .catch(err => console.error(err));
    });
</script>
